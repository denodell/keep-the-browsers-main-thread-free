<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline</title>
<style>
  :root {
    /* Instrumentation ground: cool and flat, so the white panel above it
       reads as the thing a user would actually see. */
    --bg: #DADFE0;
    --lane: #C2CACD;
    --lane-hi: #C2CACC;
    --fg: #0F1214;
    --fg-dim: #2C3437;
    --fg-faint: #46504F;
    --line: rgba(15, 18, 20, 0.34);
    --line-soft: rgba(15, 18, 20, 0.2);
    --signal: #A32414;
    --warn: #B8791B;

    --sans: ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --pad: clamp(16px, 2.4vw, 34px);

    /* The sheet is 4064x220 over sixteen drawings, so a cell is 254 wide and
       the point where the cat meets the ground is row 212 in every one of
       them. Everything below is that geometry times --s, set from script so
       the two languages cannot drift apart. */
    --s: 0.8;
    --cell: calc(254px * var(--s));
    --filmh: calc(220px * var(--s));
    --contact: calc(212px * var(--s));
    --roadh: calc(42px * var(--s));
    --roadline: calc(35px * var(--s));
    --stride: calc(132px * var(--s));

    --h-ruler: 24px;
    --h-clip: 46px;
    --h-tasks: 74px;
    --gutter: 150px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
  }
  @media (min-width: 981px) { body { height: 100vh; height: 100dvh; } }

  ::selection { background: var(--fg); color: var(--bg); }
  :focus-visible { outline: 1px solid currentColor; outline-offset: 3px; }

  /* ------------------------------------------------------------------ */
  /* Masthead                                                            */
  /* ------------------------------------------------------------------ */

  /* ------------------------------------------------------------------ */
  /* Viewer. The product panel: warm, raised, no instrumentation on it.  */
  /* ------------------------------------------------------------------ */

  .viewer {
    position: relative;
    background: #FFFFFF; color: #0B0B0B;
    display: grid; grid-template-rows: minmax(0, 1fr);
    overflow: hidden; min-height: 0;
  }

  .stage { position: relative; overflow: hidden;
           height: 100%; min-height: 186px; max-height: 348px; align-self: end; }

  /* The road belongs to the stage, not to the cat: it runs under a cat that
     is walking on the spot, so the only thing that says how fast the animal
     is moving is how fast the ground goes past. When the thread is taken
     away, both stop in the same instant. */
  .road {
    position: absolute; left: 0; bottom: 0; height: var(--roadh);
    width: calc(100% + var(--stride));
    background-image: url("images/road.png"); background-repeat: repeat-x;
    background-size: var(--stride) var(--roadh);
    will-change: transform;
  }

  /* A window one cell wide onto a strip sixteen cells long, placed so that
     row 212 -- the bottom arc of the cast shadow, the one row all sixteen
     drawings agree on -- lands on the road's edge line. */
  .window {
    position: absolute; left: 50%; margin-left: calc(var(--cell) / -2);
    top: calc(100% - var(--roadh) + var(--roadline) - var(--contact));
    width: var(--cell); height: var(--filmh); overflow: hidden;
  }
  .film {
    position: absolute; top: 0; left: 0;
    width: calc(var(--cell) * 16); height: var(--filmh);
    background-image: url("images/cat-frames.png"); background-size: 100% 100%;
    will-change: transform;
  }

  /* Sits over the stage while the thread is somewhere else. It is painted on
     the frame *before* the task runs, which is the only frame there is: once
     the task starts, nothing else gets painted until it is finished. */
  .typing {
    position: absolute; left: 50%; top: 20px; transform: translateX(-50%); z-index: 6;
    width: min(360px, 62%); font: inherit; font-family: var(--mono); font-size: 14px;
    color: #0B0B0B; background: #FFFFFF; border: 1px solid rgba(11, 11, 11, 0.3);
    padding: 10px 14px; text-align: center; letter-spacing: 0.02em;
  }
  .typing::placeholder { color: #A9B0B1; letter-spacing: 0.06em; font-size: 12px; }
  .typing:focus { outline: none; border-color: #0B0B0B; }

  /* ------------------------------------------------------------------ */
  /* Editor                                                              */
  /* ------------------------------------------------------------------ */

  .editor {
    border-top: 1px solid var(--line);
    user-select: none; -webkit-user-select: none;
    display: grid; grid-template-rows: auto auto auto; min-height: 0;
  }

  .library {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px var(--pad); border-bottom: 1px solid var(--line-soft);
  }
  .library .key { flex: 0 0 auto; margin-right: 4px; }
  .key { font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-faint); }

  .chip {
    display: inline-flex; align-items: baseline; gap: 8px;
    padding: 6px 10px; cursor: grab;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
    font: inherit; font-size: 13.5px; white-space: nowrap;
    transition: border-color 140ms ease, background 140ms ease;
  }
  .chip { text-transform: none; }      /* 500ms, not 500MS: it is a unit */
  .chip:hover { border-color: var(--fg); }
  .chip:active { cursor: grabbing; }
  .chip .swatch { width: 7px; height: 7px; align-self: center; }
  .sev-ok   { --sev: #9BA4A6; --on-sev: #0F1214; }
  .sev-warn { --sev: #E0A63C; --on-sev: #241903; }
  .sev-bad  { --sev: var(--signal); --on-sev: #F7F0E8; }
  .swatch { background: var(--sev); }

  /* ---- timeline ---------------------------------------------------- */

  .timeline { display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr);
              padding: 12px var(--pad) 0; gap: 0; min-height: 0; align-items: start; }

  .heads, .lanes {
    grid-template-rows: var(--h-ruler) var(--h-clip) var(--h-tasks);
    align-content: start;
  }
  .heads { display: grid; row-gap: 6px; padding-right: 14px; min-height: 0; }
  .head { display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
          text-align: right; gap: 2px; overflow: hidden; min-height: 0; }
  .head span { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-faint); }
  .head b { font-size: 14px; font-weight: 500; letter-spacing: 0.01em; color: var(--fg); }
  .head--on b { color: var(--fg); }
  /* Sat on the ruler's own baseline rather than centred in its row, so the
     label and the millisecond marks read as one line. */
  .head--ruler { justify-content: flex-end; }

  /* The track is fitted to this box, so at any ordinary size there is nothing
     to scroll, and a scrollbar here is a bar across the foot of the track that
     belongs to no lane. The overflow stays, because a window narrow enough to
     hit the zoom clamp still needs to be able to scroll; it just stops drawing
     itself. Nothing writes scrollLeft any more either -- keeping the playhead
     in view was for when the zoom could outgrow this box, and it cannot. */
  .scroller { overflow-x: auto; overflow-y: hidden;
              scrollbar-width: none; -ms-overflow-style: none; }
  .scroller::-webkit-scrollbar { display: none; }
  .lanes { position: relative; display: grid; row-gap: 6px; min-width: 100%; }

  .ruler { position: relative; cursor: ew-resize; border-bottom: 1px solid var(--line-soft); }
  .tick { position: absolute; bottom: 0; width: 1px; height: 6px; background: var(--line); }
  .tick.major { height: 11px; background: var(--line); }
  .tick b { position: absolute; left: 5px; bottom: 0; font: 500 11.5px/1 var(--mono);
            color: var(--fg-faint); letter-spacing: 0.04em; white-space: nowrap; }
  .tick.end { transform: translateX(-1px); }
  .tick.end b { left: auto; right: 4px; }

  /* The clip. Its filmstrip is the sprite sheet itself, tiled once per walk
     cycle, so a drawing sits exactly over the millisecond it is meant for:
     the strip is a picture of the intent, and the track below it is a
     picture of what the thread allowed. */
  .lane-clip { position: relative; background: #FFFFFF; overflow: hidden;
               outline: 1px solid var(--line-soft); outline-offset: -1px; }
  .strip { position: absolute; inset: 0;
    background-image: url("images/cat-frames.png"); background-repeat: repeat-x;
    background-position: 0 50%; }
  /* The cells the thread never got round to showing, struck through where
     they sit on the strip. */
  .strikes { position: absolute; inset: 0; display: block; width: 100%; height: 100%;
             pointer-events: none; }

  /* One hairline per drawing, so you can count them off against the track
     below and see exactly which one a block is going to cost. */
  .sprockets { position: absolute; inset: 0;
    background-image: linear-gradient(to right, rgba(11, 11, 11, 0.26) 0 1px, transparent 1px);
    background-repeat: repeat-x; }

  /* Faint vertical rules at one frame apart. A block that crosses them is a
     block that is going to cost frames, and you can count them off. */
  .lane-tasks { position: relative; background: var(--lane);
    outline: 1px solid var(--line-soft); outline-offset: -1px;
    background-image: linear-gradient(to right, rgba(15, 18, 20, 0.13) 0 1px, transparent 1px);
    background-repeat: repeat-x; background-position: 0 0; }
  .task {
    position: absolute; top: 6px; bottom: 15px; min-width: 3px;
    background: var(--sev); color: var(--on-sev); cursor: grab;
    border: 1px solid rgba(0, 0, 0, 0.22);
    padding: 4px 6px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-start; gap: 1px;
  }
  .task b { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap;
             line-height: 1.15; }
  .task i { font-style: normal; font-family: var(--mono); font-size: 11px; opacity: 0.85;
            line-height: 1.15; white-space: nowrap; }
  /* What breaking it up cost. Bold rather than brighter, because the line is
     muted with opacity and opacity is not something a child can argue with. */
  .task i em { font-style: normal; font-weight: 700; }
  .task.narrow { padding: 0; }
  .task.narrow b, .task.narrow i { display: none; }
  .task.sel { outline: 2px solid var(--fg); outline-offset: 1px; z-index: 3; }
  .task { z-index: 2; }
  .task .grip { position: absolute; right: 0; top: 0; bottom: 0; width: 9px; cursor: ew-resize;
                background: linear-gradient(to right, transparent, rgba(0,0,0,0.3)); }
  .task .grip::after { content: ""; position: absolute; right: 3px; top: 50%; height: 11px;
    width: 1px; margin-top: -6px; background: rgba(255,255,255,0.55); box-shadow: 2px 0 rgba(255,255,255,0.55); }

  /* Broken up, a block stops being one bar of work and becomes the elapsed
     time that work now takes: the pale envelope is the wall clock, the solid
     runs along the foot of it are the arithmetic, and they still add up to
     exactly what they added up to before. They have only been pushed apart.

     The runs get their own strip rather than the whole block, because a line
     of text laid over a comb of five-pixel bars is a line of text nobody can
     read. The label keeps the clear ground above them, and the argument is
     the width either way -- which the ruler measures. */
  .task.split { background: rgba(255, 255, 255, 0.55); color: var(--fg); }
  .task.split .track { position: relative; align-self: stretch; flex: 1 1 auto;
    min-height: 11px; margin: 3px -6px -4px; background: rgba(15, 18, 20, 0.11); }
  .task.narrow .track { margin: 0; }
  .task.split .pc { position: absolute; top: 0; bottom: 0; background: var(--sev); }
  /* Only where the pieces touch, so the seam never eats into the work it is
     there to separate: a microtask break has nothing to show between two
     pieces but the seam, and a real one does not need it. */
  .task.split.seam .pc { box-shadow: inset -1px 0 rgba(0, 0, 0, 0.26); }
  /* Dashed while the width is still a forecast, solid once a run has settled it. */
  .task.est { border-style: dashed; }

  .playhead { position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: var(--fg);
              pointer-events: none; z-index: 6; }
  .playhead::before { content: ""; position: absolute; left: -5px; top: 0;
    border-left: 5.5px solid transparent; border-right: 5.5px solid transparent;
    border-top: 7px solid var(--fg); }

  .ghost { position: fixed; z-index: 40; pointer-events: none; height: 34px;
    display: flex; align-items: center; padding: 0 8px; opacity: 0.9;
    background: var(--sev); color: var(--on-sev); font-size: 13px; font-weight: 600; }

  /* ---- transport --------------------------------------------------- */

  .transport { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
               padding: 12px var(--pad); }
  .transport .sp { flex: 1 1 auto; }
  button { font: inherit; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--fg); background: transparent; border: 1px solid var(--line);
    padding: 8px 13px; cursor: pointer; white-space: nowrap;
    transition: background 140ms ease, border-color 140ms ease, color 140ms ease; }
  button:hover:not(:disabled) { border-color: var(--fg); }
  button:disabled { opacity: 0.3; cursor: default; }
  button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  /* One frame, given the whole width. The timeline's axis is 1800ms and the
     pipeline's is 16.7ms, which is two orders of magnitude apart -- so the
     stages inside a frame cannot live on the main axis at any useful zoom.
     They get their own, on demand, over the top of it. */
  .inspect {
    position: absolute; left: var(--pad); right: var(--pad); bottom: 8px; z-index: 20;
    background: #FFFFFF; border: 1px solid rgba(15, 18, 20, 0.3);
    box-shadow: 0 2px 3px rgba(15, 18, 20, 0.05), 0 18px 40px -18px rgba(15, 18, 20, 0.4);
    padding: 12px 16px 14px;
  }
  .inspect[hidden] { display: none; }
  .inspect__bar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .inspect__title { margin: 0 0 20px; font-size: 14px; color: var(--fg-dim); }
  .inspect__title b { color: var(--fg); font-weight: 500; }
  .inspect__title b.over { color: var(--signal); }

  .inspect__plot { position: relative; height: 30px; background: #EDEFF0;
                   border: 1px solid var(--line-soft); }
  .inspect__plot span { position: absolute; top: 0; bottom: 0; overflow: hidden;
    font: 500 11.5px/30px var(--sans); letter-spacing: 0.02em; color: #FFFFFF;
    padding-left: 5px; white-space: nowrap; }
  /* Hot where your code is, cooling towards the screen. */
  .seg-task  { background: #A32414; }
  .seg-raf   { background: #C4632F; }
  .seg-style { background: #E0A63C; color: #241903 !important; }
  .seg-paint { background: #9BA4A6; color: #0F1214 !important; }
  /* Where the frame was supposed to have finished. */
  .inspect__budget { position: absolute; top: -4px; bottom: -4px; width: 1px;
    background: var(--fg); z-index: 3; }
  .inspect__budget b { position: absolute; left: 4px; top: -13px;
    font: 400 9px/1 var(--mono); letter-spacing: 0.06em; color: var(--fg); }

  .inspect__keys { display: flex; gap: 18px; flex-wrap: wrap; margin: 9px 0 0;
    font-family: var(--mono); font-size: 12px; color: var(--fg-faint);
    font-variant-numeric: tabular-nums; }
  .inspect__keys i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; }
  .inspect__keys b { color: var(--fg); font-weight: 400; }
  .inspect__notes { margin: 8px 0 0; font-size: 13px; color: var(--fg-dim); }
  .inspect__notes b { color: var(--fg); font-weight: 500; }
  .inspect__notes b.hot { color: var(--signal); }

  /* The strip is where the frames are, so the strip is what you open one from. */
  .lane-clip { cursor: pointer; }

  @media (max-width: 1200px) {
    :root { --gutter: 126px; }
    .library, .transport { gap: 7px; }
    .chip { font-size: 12.5px; padding: 6px 9px; gap: 7px; }
    button { padding: 7px 10px; letter-spacing: 0.12em; font-size: 10.5px; }
    /* The gutter narrows with everything else, so its labels have to stop
       wrapping -- a two-line label in a twenty-two pixel row is a cut-off one. */
    .head b { font-size: 13px; white-space: nowrap; }
    .head span { font-size: 10px; }
  }

  @media (max-width: 980px) {
    .heads { display: none; }
    .timeline { grid-template-columns: minmax(0, 1fr); }
  }

  /* Page switcher: one narrow strip across the top of both demos. */
  .pages { display: flex; align-items: center; gap: 22px; height: 32px;
           padding: 0 var(--pad); border-bottom: 1px solid var(--line);
           font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
  .pages a { color: var(--fg-dim); text-decoration: none; padding: 4px 0; }
  .pages a:hover { color: var(--fg); }
  .pages a[aria-current="page"] { color: var(--fg); box-shadow: inset 0 -1px currentColor; }
</style>
</head>
<body>

<nav class="pages" aria-label="Demos">
  <a href="index.html" aria-current="page">Timeline</a>
  <a href="three-cats.html">Three Ways</a>
</nav>

<section class="viewer">
  <div class="stage" id="stage">
    <div class="road" id="road"></div>
    <div class="window"><div class="film" id="film"></div></div>
  </div>

  <input class="typing" id="typing" type="text" spellcheck="false" autocomplete="off"
         placeholder="type here">

  <div class="inspect" id="inspect" hidden>
    <div class="inspect__bar">
      <p class="inspect__title" id="ins-title"></p>
      <button type="button" id="ins-close">Close</button>
    </div>
    <div class="inspect__plot" id="ins-plot"></div>
    <p class="inspect__keys" id="ins-keys"></p>
    <p class="inspect__notes" id="ins-notes"></p>
  </div>
</section>

<section class="editor">

  <div class="library">
    <span class="key">Add task</span>
  </div>

  <div class="timeline">
    <div class="heads">
      <div class="head head--ruler"><span>Main thread</span></div>
      <div class="head head--on"><b>Animation</b></div>
      <div class="head head--on"><b>Your tasks</b></div>
    </div>

    <div class="scroller" id="scroller">
      <div class="lanes" id="lanes">
        <div class="ruler" id="ruler"></div>
        <div class="lane-clip">
          <div class="strip" id="strip"></div>
          <div class="sprockets" id="sprockets"></div>
          <canvas class="strikes" id="strikes"></canvas>
        </div>
        <div class="lane-tasks" id="lane-tasks"></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </div>
  </div>

  <div class="transport">
    <span class="sp"></span>
    <button type="button" id="split" disabled>Break it up</button>
    <button type="button" id="clear">Clear</button>
    <span class="sp"></span>
  </div>

</section>

<script>
(() => {
  'use strict';

  /* ------------------------------------------------------------------ */
  /* The take                                                            */
  /* ------------------------------------------------------------------ */

  let S = 0.8;                         // the whole scene, sheet geometry included
  let CELL = 254 * S;                  // one drawing, on screen
  let STRIDE = 132 * S;                // one stride, which is also one road tile
  const FRAMES = 16;
  const CYCLE = 900;                   // ms for the sixteen drawings: on twos
  const TOTAL = 1800;                  // two cycles, so the loop is seamless
  const VSYNC = 1000 / 60;
  const SLOTS = Math.round(TOTAL / VSYNC);
  const FRAME_MS = CYCLE / FRAMES;     // 56.25ms: what one drawing is owed
  const CELLS = Math.round(TOTAL / FRAME_MS);   // cells on the strip, 32 of them
  let SPEED = STRIDE / CYCLE;          // px per ms; the feet only stay planted at this one

  /* Five ways to break between one chunk and the next, and only four of them
     are yields. Each one is the real call, awaited for real -- the microtask
     row is not a model of what a promise does to your frames, it is a promise
     doing it. */
  const YIELDS = [
    { id: 'microtask', short: 'microtask', label: 'await Promise.resolve()',
      run: () => Promise.resolve(), ok: true },
    { id: 'timeout', short: 'setTimeout', label: 'await setTimeout(0)',
      run: () => new Promise((r) => setTimeout(r, 0)), ok: true },
    { id: 'raf', short: 'rAF', label: 'await requestAnimationFrame()',
      run: () => new Promise((r) => requestAnimationFrame(r)), ok: true },
    { id: 'yield', short: 'scheduler.yield', label: 'await scheduler.yield()',
      run: () => scheduler.yield(),
      ok: typeof scheduler !== 'undefined' && typeof scheduler.yield === 'function' },
    { id: 'idle', short: 'idle', label: 'await requestIdleCallback()',
      run: () => new Promise((r) => requestIdleCallback(r)),
      ok: typeof requestIdleCallback === 'function' },
  ];
  const yieldBy = (id) => YIELDS.find((y) => y.id === id && y.ok) || YIELDS[1];

  const LIBRARY = [{ dur: 500 }];

  const PRESET = [];

  const $ = (id) => document.getElementById(id);

  /* One scale for the scene, read off the monitor it has to fit. 219 units is
     the drop from the top of a drawing to the stage floor: the contact row,
     less the road's edge line, plus the road. Stylesheet and script both work
     from it, so they cannot disagree about where the ground is. */
  function scaleScene() {
    const h = stage.clientHeight;
    if (!h) return;
    S = Math.max(0.55, Math.min(1.24, (h - 26) / 219));
    CELL = 254 * S; STRIDE = 132 * S; SPEED = STRIDE / CYCLE;
    document.documentElement.style.setProperty('--s', String(S));
  }

  const stage = $('stage'), road = $('road'), film = $('film');
  const scroller = $('scroller'), lanes = $('lanes'), ruler = $('ruler');
  const strip = $('strip'), laneTasks = $('lane-tasks'), playhead = $('playhead');
  const css = getComputedStyle(document.documentElement);
  /* Whether a label fits has to be measured, and measuring it off the DOM
     would mean a forced layout on every redraw -- on this page of all pages.
     A detached canvas answers the same question without touching the
     document, in the same two fonts the blocks are set in. */
  const meas = document.createElement('canvas').getContext('2d');
  const FONT_B = '600 13px ' + css.getPropertyValue('--sans').trim();
  const FONT_I = '11px ' + css.getPropertyValue('--mono').trim();
  const fits = (text, font, px) => { meas.font = font; return meas.measureText(text).width <= px; };
  const strikes = $('strikes'), sctx = strikes.getContext('2d');
  const btnSplit = $('split');

  let uid = 0;
  const nextId = () => 't' + (++uid);
  const sev = (d) => d <= VSYNC ? 'sev-ok' : d <= 50 ? 'sev-warn' : 'sev-bad';

  let tasks = PRESET.map((p) => ({ id: nextId(), chunks: 1, yield: 'timeout', ...p }));
  /* Same work, longer wall clock, and the block says so. A block at fit zoom
     is sixty pixels wide and two durations will not go in sixty pixels, so
     the label is a ladder rather than a string: the longest rung that fits
     wins, and the pair of numbers is the last thing to be given up because
     the pair of numbers is the argument. */
  const labels = (task) => {
    const w0 = Math.round(task.dur), w1 = Math.round(spanOf(task));
    return w1 - w0 >= 1
      ? [w0 + 'ms \u2192 ' + w1 + 'ms', w0 + '\u2192' + w1 + 'ms', w0 + '\u2192' + w1]
      : [w0 + 'ms'];
  };

  /* The second line: what the break cost as a share of the work, and then how
     the break was made. The percentage is the punchline -- the durations say
     the same thing but you have to do the arithmetic yourself -- so it is the
     last thing on the line to be given up and the only thing on it set bold.
     Each rung is carried as [what to measure, what to write], because the
     emphasis is markup and markup has no width. */
  const subs = (task) => {
    const how = task.chunks > 1 ? task.chunks + '\u00D7 ' + yieldBy(task.yield).short : '';
    const pc = Math.round((spanOf(task) / task.dur - 1) * 100);
    if (!pc) return how ? [[how, how]] : [];
    const grew = '+' + pc + '%', em = '<em>' + grew + '</em>';
    return how ? [[grew + ' \u00B7 ' + how, em + ' \u00B7 ' + how], [grew, em]] : [[grew, em]];
  };
  const defaultYield = 'timeout';      // the one way the pieces hand it back
  let selected = null;
  let zoom = 0.6;                      // px per ms, set from the width by fit()
  let playing = true;                  // the take runs from the moment it loads
  let t = 0;                           // playhead, ms into the take
  let lapStart = 0;                    // performance.now() that maps to t = 0
  const fired = new Set();             // tasks already run this lap
  const running = new Set();           // tasks part-way through their chunks
  let pending = [];                    // tasks scheduled to run after this paint
  let chain = Promise.resolve();       // so queued tasks run one after another
  let runToken = 0;                    // bumped to abandon work already under way

  /* The playhead is wall-clock time, and wall-clock time does not stop for a
     blocked thread. So it is handed to the compositor as a plain transform
     animation and left there: while a task holds this thread, the cat, the
     road, the ticks and the strikes all stop dead and the playhead sails on
     over them. Everything else on the page needs this thread. That one line
     does not, and the gap between them is the whole point.

     It stays in step by construction rather than by correction: the animation
     sits on the document timeline, which is the same clock performance.now()
     reads, so giving it a startTime of lapStart makes its progress identical
     to t without anyone having to keep them level. */
  const CAN_SWEEP = typeof playhead.animate === 'function';
  let sweep = null;

  function syncSweep() {
    if (!CAN_SWEEP) return;
    if (sweep) sweep.cancel();
    sweep = playhead.animate(
      [{ transform: 'translateX(0px)' }, { transform: 'translateX(' + x(TOTAL) + 'px)' }],
      { duration: TOTAL, iterations: Infinity, easing: 'linear' }
    );
    if (playing) {
      try { sweep.startTime = lapStart; }        // same origin as t, so no drift
      catch (_) { sweep.currentTime = t; }
    } else {
      sweep.currentTime = t;
      sweep.pause();
    }
  }

  /* Everything the thread actually managed, one entry per vsync slot:
     null = not reached yet, 0 = the playhead went past without a paint,
     otherwise the drawing that was on screen. Nothing here is modelled --
     it is written from inside requestAnimationFrame, so a gap in it is a gap
     that really happened. */
  let slots = new Array(SLOTS).fill(null);
  let lastSlot = null;
  let predicted = new Uint8Array(0);   // recomputed whenever the track changes
  let frames = new Array(SLOTS).fill(null);   // per-slot breakdown, where the browser gave one
  let openSlot = null;                        // which frame the inspector is showing

  /* A measurement belongs to the edit that produced it. Change the edit and it
     is no longer a reading of anything, so it goes -- and the forecast takes
     over until the next run. */
  function invalidate() {
    slots = new Array(SLOTS).fill(null);
    lastSlot = null;
    frames = new Array(SLOTS).fill(null);
    tasks.forEach((task) => { task.marks = null; });   // widths go back to forecast
    closeFrame();
  }

  /* ------------------------------------------------------------------ */
  /* Layout                                                              */
  /* ------------------------------------------------------------------ */

  const x = (ms) => ms * zoom;
  const ms = (px) => px / zoom;

  function buildLibrary() {
    const bar = document.querySelector('.library');
    LIBRARY.forEach((spec) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip ' + sev(spec.dur);
      b.innerHTML = '<span class="swatch"></span>' + spec.dur + 'ms';
      b.addEventListener('pointerdown', (e) => startNew(e, spec));
      b.addEventListener('click', () => add(spec, t));
      bar.appendChild(b);
    });
  }

  function buildRuler() {
    ruler.textContent = '';
    for (let v = 0; v <= TOTAL; v += 100) {
      const major = v % 300 === 0;
      const d = document.createElement('div');
      d.className = 'tick' + (major ? ' major' : '') + (v === TOTAL ? ' end' : '');
      d.style.left = x(v) + 'px';
      if (major) d.innerHTML = '<b>' + v + '</b>';
      ruler.appendChild(d);
    }
  }

  function layout() {
    lanes.style.width = x(TOTAL) + 'px';
    strip.style.backgroundSize = x(CYCLE) + 'px auto';       // one tile = one cycle
    // What that tile actually comes out as, vertically, plus a little air.
    const stripH = (x(CYCLE) / FRAMES) * (220 / 254);
    document.documentElement.style.setProperty('--h-clip',
      Math.round(Math.max(40, Math.min(124, stripH + 10))) + 'px');
    $('sprockets').style.backgroundSize = x(CYCLE / FRAMES) + 'px 100%';
    laneTasks.style.backgroundSize = x(VSYNC) + 'px 100%';   // one rule = one frame
    buildRuler();
    drawTasks();
    sizeCanvas();
    syncSweep();
  }

  function sizeCanvas() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = strikes.parentElement.clientWidth || x(TOTAL);
    strikes.width = Math.round(w * dpr);
    strikes.height = Math.round(strikes.parentElement.clientHeight * dpr);
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function fit() {
    const w = Math.floor(scroller.getBoundingClientRect().width);
    if (w > 40) zoom = Math.max(0.25, Math.min(2, w / TOTAL));
    layout();
  }

  /* ------------------------------------------------------------------ */
  /* The track                                                           */
  /* ------------------------------------------------------------------ */

  /* What one break between two pieces costs, in milliseconds. None of these
     is a round number picked because it draws well:

       microtask   0    The queue is drained to the bottom before the browser
                        is allowed to render, so nothing is handed back and
                        nothing is waited for. Free, and worth what it costs.
       setTimeout  4    Once a timer is nested five deep -- which a chunked
                        loop is by its sixth piece -- the HTML spec clamps the
                        wait to a minimum of 4ms.
       yield       1    scheduler.yield resumes at the head of the queue,
                        ahead of timers: the cheapest real hand-back there is.
                        Still not free, because the turn still has to end.
       rAF, idle   --   Cannot resume before the next vsync, so the wait is
                        whatever is left of the frame the piece landed in.

     A run measures the real thing and overwrites every one of them. This is
     only what the track can say before you have pressed play. */
  const GAP = { microtask: 0, timeout: 4, yield: 1 };
  function gapFor(task, piece) {
    if (task.yield === 'raf' || task.yield === 'idle') {
      return Math.max(0, VSYNC - (piece % VSYNC));      // on to the next vsync
    }
    const g = GAP[task.yield];
    return g === undefined ? GAP.timeout : g;
  }

  /* Where a block's pieces fall, in ms from the block's own start. A run that
     finished wins; otherwise it is the table above. The block, its label and
     the frame forecast are all drawn from this one list, so none of the three
     can drift away from the other two. */
  function pieces(task) {
    if (task.marks && task.marks.length) return task.marks;
    const n = Math.max(1, task.chunks || 1);
    const piece = task.dur / n;
    const gap = n > 1 ? gapFor(task, piece) : 0;
    const out = [];
    for (let i = 0; i < n; i++) {
      const from = i * (piece + gap);
      out.push([from, from + piece]);
    }
    return out;
  }
  const spanOf = (task) => { const p = pieces(task); return p[p.length - 1][1]; };

  function drawTasks() {
    laneTasks.querySelectorAll('.task').forEach((el) => el.remove());   // the canvas stays
    tasks.slice().sort((a, b) => a.at - b.at).forEach((task) => {
      const el = document.createElement('div');
      const segs = pieces(task);
      const split = segs.length > 1;
      // The block is elapsed time now, so it ends where the take ends even
      // when the work it is carrying would have run on past it.
      const w = Math.max(3, Math.min(x(segs[segs.length - 1][1]), x(TOTAL - task.at)));
      const piece = task.dur / Math.max(1, task.chunks);
      // Coloured by the piece, because the piece is what actually goes on the
      // thread in one go -- a block of red cut into thirteen grey ones is the
      // point, and the colour has to move when the pieces do.
      const seam = split && x(segs[1][0] - segs[0][1]) < 1.5;   // pieces that abut
      el.className = 'task ' + sev(piece) + (task.id === selected ? ' sel' : '') +
                     (w < 46 ? ' narrow' : '') + (split ? ' split' : '') +
                     (seam ? ' seam' : '') + (split && !task.marks ? ' est' : '');
      el.dataset.id = task.id;
      el.style.left = x(task.at) + 'px';
      el.style.width = w + 'px';
      // The pieces, laid along the foot of that span where they land. However
      // far apart they get pushed, the runs still come to task.dur between
      // them: the strip they sit on is the waiting, and it is all that grew.
      const inside = split ? '<span class="track">' + segs.map(([a, b]) =>
        '<span class="pc" style="left:' + x(a) + 'px;width:' +
        Math.max(1, x(b - a)) + 'px"></span>').join('') + '</span>' : '';
      // Room inside the block, less its padding and a little air.
      const room = w - 15;
      const rungs = labels(task);
      const head = rungs.find((r) => fits(r, FONT_B, room)) || rungs[rungs.length - 1];
      // How it was broken up is the first thing to go: the comb below already
      // shows that it was, and the line it gives up goes to the comb.
      const sub = subs(task).find(([plain]) => fits(plain, FONT_I, room));
      el.innerHTML = '<b>' + head + '</b>' +
        (sub ? '<i>' + sub[1] + '</i>' : '') +
        inside + '<span class="grip"></span>';
      laneTasks.appendChild(el);
    });
    predicted = predictLost();

    const sel = tasks.find((x) => x.id === selected) || null;
    btnSplit.disabled = !sel;
    btnSplit.textContent = sel && sel.chunks > 1 ? 'Merge back' : 'Break it up';
  }

  function add(spec, at) {
    const task = { id: nextId(), dur: spec.dur, chunks: 1, yield: defaultYield,
                   at: Math.max(0, Math.min(TOTAL - spec.dur, at)) };
    tasks.push(task);
    invalidate();
    selected = task.id;
    if (playing && t > task.at) fired.add(task.id);   // do not run something the playhead is already past
    drawTasks();
  }

  function select(id) { selected = id; drawTasks(); }

  /* Cutting a task up does not change how much work there is: the same
     arithmetic runs, and it still starts where you put it. What it changes is
     how long that work takes to get through, because every hand-back costs
     something and there are now a dozen of them. So the block gets wider
     while the colour inside it stays exactly the same size -- which is the
     trade, and the whole argument. */
  const chunkCount = (task) => Math.max(2, Math.ceil(task.dur / 8));

  function toggleChunks() {
    const task = tasks.find((x) => x.id === selected);
    if (!task) return;
    task.chunks = task.chunks > 1 ? 1 : chunkCount(task);
    invalidate();
    drawTasks();
  }

  /* ------------------------------------------------------------------ */
  /* Dragging: existing blocks, and new ones off the library             */
  /* ------------------------------------------------------------------ */

  let drag = null, ghost = null;

  function timeAt(clientX) {
    return ms(clientX - lanes.getBoundingClientRect().left);
  }

  laneTasks.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.task');
    if (!el) { select(null); return; }
    const task = tasks.find((x) => x.id === el.dataset.id);
    select(task.id);
    drag = {
      mode: e.target.classList.contains('grip') ? 'resize' : 'move',
      task, x0: e.clientX, at0: task.at, dur0: task.dur, moved: false,
    };
    e.preventDefault();
  });

  function startNew(e, spec) {
    drag = { mode: 'new', spec, x0: e.clientX, moved: false };
    e.preventDefault();
  }

  addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x0;
    if (!drag.moved && Math.abs(dx) < 3) return;
    drag.moved = true;

    if (drag.mode === 'new') {
      if (!ghost) {
        ghost = document.createElement('div');
        ghost.className = 'ghost ' + sev(drag.spec.dur);
        ghost.textContent = drag.spec.dur + 'ms';
        document.body.appendChild(ghost);
      }
      ghost.style.width = Math.max(20, x(drag.spec.dur)) + 'px';
      ghost.style.left = (e.clientX - 6) + 'px';
      ghost.style.top = (e.clientY - 17) + 'px';
      return;
    }

    const task = drag.task;
    if (drag.mode === 'move') {
      task.at = Math.max(0, Math.min(TOTAL - task.dur, drag.at0 + ms(dx)));
    } else {
      task.dur = Math.max(2, Math.min(TOTAL - task.at, drag.dur0 + ms(dx)));
    }
    invalidate();
    drawTasks();
  });

  addEventListener('pointerup', (e) => {
    if (!drag) return;
    if (drag.mode === 'new' && drag.moved) {
      const r = laneTasks.getBoundingClientRect();
      const inside = e.clientX >= r.left && e.clientX <= r.right &&
                     e.clientY >= r.top - 24 && e.clientY <= r.bottom + 24;
      if (inside) add(drag.spec, timeAt(e.clientX));
    }
    if (ghost) { ghost.remove(); ghost = null; }
    drag = null;
  });

  /* Scrubbing. Dragging the ruler moves the playhead, and because the walk
     is a pure function of the playhead, the cat scrubs with it. */
  let scrubbing = false;
  ruler.addEventListener('pointerdown', (e) => {
    scrubbing = true;
    // Capture only keeps the drag alive once the cursor leaves the ruler. It
    // is a convenience, and it throws for any pointer the browser is not
    // already tracking, so it must not be able to take the scrub down with it.
    try { ruler.setPointerCapture(e.pointerId); } catch (_) {}
    scrub(e);
  });
  ruler.addEventListener('pointermove', (e) => { if (scrubbing) scrub(e); });
  ruler.addEventListener('pointerup', () => { scrubbing = false; });

  function scrub(e) {
    seek(Math.max(0, Math.min(TOTAL, timeAt(e.clientX))));
  }

  function seek(to) {
    t = to;
    lapStart = performance.now() - t;
    lastSlot = null;                                  // do not blame the scrub for a gap
    fired.clear();
    tasks.forEach((task) => { if (task.at < t) fired.add(task.id); });
    syncSweep();
    render();
  }

  /* ------------------------------------------------------------------ */
  /* Running it, for real                                                */
  /* ------------------------------------------------------------------ */

  // No modelling anywhere in here. A block on the track is arithmetic that
  // actually runs, on this thread, for as long as the block is wide.
  function burn(duration) {
    const end = performance.now() + duration;
    let sink = 0;
    while (performance.now() < end) for (let i = 0; i < 1500; i++) sink += Math.sqrt(i * 1.0001);
    return sink;
  }

  /* The work is the same however it is cut up: task.dur of arithmetic, in
     task.chunks pieces. What changes is the one line between the pieces --
     and awaiting a resolved promise is not a yield. The microtask queue is
     drained to the bottom before the browser is allowed to render, so a
     chunked loop written that way hands the thread back to nobody and the
     frames die exactly as they would have without it. */
  async function runTask(task, token) {
    running.add(task.id);
    const n = Math.max(1, task.chunks || 1);
    const each = task.dur / n;
    const y = yieldBy(task.yield);
    const marks = [];                         // where the pieces really fell
    let base = null;
    for (let i = 0; i < n; i++) {
      if (token !== runToken) break;          // the take stopped under us
      const from = performance.now();
      burn(each);
      const to = performance.now();
      if (base === null) base = from;
      marks.push([from - base, to - base]);
      if (i < n - 1) await y.run();
    }
    running.delete(task.id);
    /* A run that got all the way through is a reading of this block, so the
       block stops guessing: it is redrawn at the width the browser actually
       took, gaps and all. A half-finished one is a reading of nothing.

       The redraw goes out on a timeout for the same reason the run did: it is
       this page's own work, and it has no business landing in the middle of a
       frame it is supposed to be measuring. */
    if (token === runToken && marks.length === n) {
      task.marks = marks;
      setTimeout(drawTasks, 0);
    }
  }

  function runPending() {
    const queue = pending;
    pending = [];
    const token = runToken;
    for (const task of queue) chain = chain.then(() => runTask(task, token));
  }

  function newLap() {
    lastSlot = null;                 // do not blame the wrap for a gap
    fired.clear();
  }

  function frame() {
    requestAnimationFrame(frame);

    if (playing) {
      t = performance.now() - lapStart;
      if (t >= TOTAL) {
        lapStart += Math.floor(t / TOTAL) * TOTAL;
        t = performance.now() - lapStart;
        newLap();
      }

      /* Anything the playhead has reached goes on the queue. It is run from a
         timeout rather than from here, so the frame we are in the middle of
         gets painted first -- which is what makes the badge visible and what
         makes the freeze land where a real task would put it: between two
         paints, not before one. */
      if (playing) {
        const due = tasks.filter((task) => !fired.has(task.id) && !running.has(task.id) && task.at <= t)
                         .sort((a, b) => a.at - b.at);
        if (due.length) {
          due.forEach((task) => { fired.add(task.id); pending.push(task); });
          // Run from a timeout rather than from here, so the frame we are in
          // the middle of gets painted first and the freeze lands where a real
          // task would put it: between two paints, not before one.
          setTimeout(runPending, 0);
        }
      }

      record();
    }

    render();
  }

  function record() {
    const slot = Math.max(0, Math.min(SLOTS - 1, Math.floor(t / VSYNC)));
    if (lastSlot !== null) for (let i = lastSlot + 1; i < slot; i++) slots[i] = 0;
    slots[slot] = cellAt(t) + 1;      // +1 so slot 0 and cell 0 stay distinguishable
    lastSlot = slot;
  }

  const drawingAt = (at) => Math.floor(((at % CYCLE) / CYCLE) * FRAMES) % FRAMES;

  /* The browser will break a frame down into its stages, but only for frames
     that already went wrong: nothing under about 50ms is reported at all. That
     is the right half of the bargain for this page -- the frames worth opening
     are exactly the ones it tells you about. */
  const LOAF = typeof PerformanceObserver !== 'undefined' &&
    PerformanceObserver.supportedEntryTypes &&
    PerformanceObserver.supportedEntryTypes.includes('long-animation-frame');

  if (LOAF) {
    new PerformanceObserver((list) => list.getEntries().forEach(keepFrame))
      .observe({ type: 'long-animation-frame', buffered: true });
  }

  function keepFrame(e) {
    const at = e.startTime - lapStart;
    if (at < 0 || at >= TOTAL) return;               // not part of the take on screen
    const rel = (v) => (typeof v === 'number' && v > 0 ? v - e.startTime : null);
    frames[Math.min(SLOTS - 1, Math.floor(at / VSYNC))] = {
      at,
      total: e.duration,
      blocking: e.blockingDuration || 0,
      renderStart: rel(e.renderStart),
      styleStart: rel(e.styleAndLayoutStart),
      paint: rel(e.paintTime),
      present: rel(e.presentationTime),
      forced: (e.scripts || []).reduce((n, x) => n + (x.forcedStyleAndLayoutDuration || 0), 0),
      scripts: (e.scripts || []).map((x) => ({
        who: x.invoker || x.name || 'script', dur: x.duration })),
    };
  }

  /* What the current edit is going to cost, worked out from the blocks rather
     than measured from a run -- so the strip answers while you are still
     dragging, before anything has been played.

     This is the one thing on the page that is modelled, and it is drawn
     differently for that reason: hollow while it is a forecast, filled in once
     a run has been through and knows. The forecast can be wrong -- a stall
     pushes later tasks along, and scheduler.yield does not hand the thread
     back as often as the arithmetic here assumes -- which is exactly why
     pressing play is still the thing that settles it. */
  function predictLost() {
    const lost = new Uint8Array(CELLS);
    if (!tasks.length) return lost;

    // Every stretch the thread is expected to be busy, in take time -- read
    // off the same pieces the blocks are drawn from, so the strip and the
    // track cannot end up telling you two different stories.
    const busyIv = [];
    tasks.forEach((task) => {
      pieces(task).forEach(([a, b]) => busyIv.push([task.at + a, task.at + b]));
    });

    // Same test the measurement uses: a drawing is lost when every vsync in
    // its 56ms is swallowed.
    const total = new Uint8Array(CELLS), blocked = new Uint8Array(CELLS);
    for (let i = 0; i < SLOTS; i++) {
      const at = i * VSYNC;
      const c = Math.min(CELLS - 1, Math.floor(at / FRAME_MS));
      total[c]++;
      if (busyIv.some(([a, b]) => at >= a && at < b)) blocked[c]++;
    }
    for (let c = 0; c < CELLS; c++) if (total[c] && blocked[c] === total[c]) lost[c] = 1;
    return lost;
  }
  const cellAt = (at) => Math.min(CELLS - 1, Math.floor(at / FRAME_MS));

  /* Which cells of the strip made it to the screen. A cell is struck out only
     once the playhead has been the whole way through it and no sample taken
     inside it ever showed it: the thread was somewhere else for all 56ms it
     was owed, so that drawing was never seen by anybody. */
  function cellsShown() {
    const shown = new Uint8Array(CELLS), seen = new Uint8Array(CELLS);
    for (let i = 0; i < SLOTS; i++) {
      const v = slots[i];
      if (v === null) continue;
      seen[Math.min(CELLS - 1, Math.floor((i * VSYNC) / FRAME_MS))] = 1;
      if (v > 0) shown[v - 1] = 1;
    }
    return { shown, seen };
  }

  /* ------------------------------------------------------------------ */
  /* Painting                                                            */
  /* ------------------------------------------------------------------ */

  function render() {
    const drawing = drawingAt(t);
    film.style.transform = 'translateX(' + (-drawing * CELL) + 'px)';
    road.style.transform = 'translateX(' + (-((t * SPEED) % STRIDE)) + 'px)';

    if (!CAN_SWEEP) playhead.style.transform = 'translateX(' + x(t) + 'px)';

    const { shown, seen } = cellsShown();
    drawStrikes(shown, seen);
  }

  /* One frame across the full width. Every boundary here is a field the
     browser reported, not a share worked out from the total: where its own
     work began, where style and layout began, when it was painted, and when it
     actually reached the screen. */
  function openFrame(slot) {
    const f = frames[slot];
    if (!f) return closeFrame();
    if (openSlot === slot) return closeFrame();      // clicking it again puts it away
    openSlot = slot;

    const span = f.present || f.total;
    const b1 = f.renderStart != null ? Math.max(0, f.renderStart) : span;
    const b2 = f.styleStart != null ? Math.max(b1, f.styleStart) : b1;
    const b3 = f.paint != null ? Math.max(b2, f.paint) : b2;

    const parts = [
      { cls: 'seg-task',  name: 'Task', from: 0, to: b1 },
      { cls: 'seg-raf',   name: 'rAF callbacks', from: b1, to: b2 },
      { cls: 'seg-style', name: 'Style, layout, paint', from: b2, to: b3 },
      { cls: 'seg-paint', name: 'To screen', from: b3, to: span },
    ];

    const plot = $('ins-plot');
    plot.textContent = '';
    parts.forEach((p) => {
      const pc = (p.to - p.from) / span * 100;
      if (pc <= 0.15) return;
      const el = document.createElement('span');
      el.className = p.cls;
      el.style.left = (p.from / span * 100) + '%';
      el.style.width = pc + '%';
      if (pc > 14) el.textContent = p.name;
      plot.appendChild(el);
    });
    if (span > VSYNC) {
      const mark = document.createElement('div');
      mark.className = 'inspect__budget';
      mark.style.left = (VSYNC / span * 100) + '%';
      mark.innerHTML = '<b>16.7ms</b>';
      plot.appendChild(mark);
    }

    const over = span / VSYNC;
    $('ins-title').innerHTML =
      'Frame at <b>' + Math.round(f.at) + 'ms</b> &middot; took <b class="' +
      (over > 1 ? 'over' : '') + '">' + ms1(span) + '</b>' +
      (over > 1.2 ? ' &middot; <b class="over">' + over.toFixed(1) + '× its budget</b>' : '');

    $('ins-keys').innerHTML = parts.map((p) =>
      '<span><i class="' + p.cls + '"></i>' + p.name + ' <b>' + ms1(p.to - p.from) + '</b></span>'
    ).join('');

    const notes = [];
    if (f.blocking) notes.push('Input would have waited <b class="hot">' + ms1(f.blocking) + '</b>');
    notes.push('Layout forced from script <b' + (f.forced > 1 ? ' class="hot"' : '') + '>' +
               ms1(f.forced) + '</b>');
    if (f.scripts.length) {
      notes.push(f.scripts.slice(0, 3).map((x) => x.who + ' <b>' + ms1(x.dur) + '</b>').join(', '));
    }
    $('ins-notes').innerHTML = notes.join(' &middot; ');
    $('inspect').hidden = false;
  }

  function closeFrame() {
    openSlot = null;
    const el = document.getElementById('inspect');
    if (el) el.hidden = true;
  }

  const ms1 = (v) => (v < 10 ? v.toFixed(1) : Math.round(v)) + 'ms';

  /* A drawing that never reached the screen is still sitting there in the
     source, which is the whole cruelty of it: the work was drawn, laid out on
     the right millisecond, and then skipped. Crossing it out on the strip
     says that plainly -- these are the ones the thread cost you. */
  function drawStrikes(shown, seen) {
    const w = strikes.clientWidth, h = strikes.clientHeight;
    if (!w || !h) return;
    sctx.clearRect(0, 0, w, h);
    sctx.lineCap = 'round';

    for (let c = 0; c < CELLS; c++) {
      // A cell the playhead has been through is answered; anything else is
      // still only the forecast talking.
      const measured = !!seen[c];
      const gone = measured ? !shown[c] : !!predicted[c];
      if (!gone) continue;

      const x0 = x(c * FRAME_MS), x1 = x((c + 1) * FRAME_MS);
      const inset = Math.min(4, (x1 - x0) * 0.16);

      sctx.fillStyle = measured ? 'rgba(163, 36, 20, 0.12)' : 'rgba(163, 36, 20, 0.07)';
      sctx.fillRect(x0, 0, x1 - x0, h);

      sctx.lineWidth = measured ? 1.25 : 1;
      sctx.setLineDash(measured ? [] : [4, 3]);
      sctx.strokeStyle = measured ? 'rgba(163, 36, 20, 0.6)' : 'rgba(163, 36, 20, 0.5)';
      sctx.beginPath();
      sctx.moveTo(x0 + inset, inset);      sctx.lineTo(x1 - inset, h - inset);
      sctx.moveTo(x1 - inset, inset);      sctx.lineTo(x0 + inset, h - inset);
      sctx.stroke();

      // the cell walls, so a run of struck cells still reads as separate ones
      sctx.setLineDash([]);
      sctx.lineWidth = 1;
      sctx.strokeStyle = measured ? 'rgba(163, 36, 20, 0.34)' : 'rgba(163, 36, 20, 0.2)';
      sctx.beginPath();
      sctx.moveTo(x0 + 0.5, 0); sctx.lineTo(x0 + 0.5, h);
      sctx.moveTo(x1 - 0.5, 0); sctx.lineTo(x1 - 0.5, h);
      sctx.stroke();
    }
    sctx.setLineDash([]);
  }

  /* ------------------------------------------------------------------ */
  /* Transport                                                           */
  /* ------------------------------------------------------------------ */

  /* There is no transport. The take runs from the moment the page opens and
     keeps running, because the thing being demonstrated is what a task does
     to an animation that is already going -- and an animation you have to
     press play on is not one that was already going. Dragging the ruler is
     still there for anyone who wants to stand still inside it. */
  function start() {
    playing = true;
    lapStart = performance.now() - t;
    lastSlot = null;
    fired.clear();
    tasks.forEach((task) => { if (task.at < t) fired.add(task.id); });
    syncSweep();
  }

  function removeSelected() {
    if (!selected) return;
    tasks = tasks.filter((x) => x.id !== selected);
    selected = null;
    invalidate();
    drawTasks();
  }

  btnSplit.addEventListener('click', toggleChunks);
  /* There is no separate row of paint ticks any more -- a drawing crossed out
     on the strip says the same thing in the language the page is already
     speaking -- so the strip itself is what you click to open a frame. The
     ones the browser breaks down are the slow ones, which are the crossed-out
     ones, so a click on a cross generally lands on something. */
  document.querySelector('.lane-clip').addEventListener('click', (e) => {
    const at = ms(e.clientX - lanes.getBoundingClientRect().left);
    const slot = Math.floor(at / VSYNC);
    // The openable frames are sparse, so a click near one counts as a click on it.
    for (let d = 0; d <= 3; d++) {
      if (frames[slot + d]) return openFrame(slot + d);
      if (d && frames[slot - d]) return openFrame(slot - d);
    }
    closeFrame();
  });
  $('ins-close').addEventListener('click', closeFrame);

  $('clear').addEventListener('click', () => {
    tasks = []; selected = null; invalidate(); drawTasks();
  });

  addEventListener('keydown', (e) => {
    // A key event can target the document or the window, neither of which has
    // matches(); and the yield picker wants its own arrow keys.
    const el = e.target;
    if (el && el.matches && el.matches('input, select, textarea')) return;
    if (e.key === 'Escape') { closeFrame(); }
    else if ((e.key === 'Backspace' || e.key === 'Delete') && selected) { e.preventDefault(); removeSelected(); }
    else if (selected && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      const task = tasks.find((x) => x.id === selected);
      const step = (e.shiftKey ? VSYNC : 1) * (e.key === 'ArrowLeft' ? -1 : 1);
      task.at = Math.max(0, Math.min(TOTAL - task.dur, task.at + step));
      e.preventDefault();
      drawTasks();
    }
  });

  // The track is always exactly as wide as there is room for it, so a resize
  // is a re-fit rather than a scroll.
  addEventListener('resize', () => { scaleScene(); fit(); sizeCanvas(); });

  buildLibrary();
  scaleScene();
  fit();
  start();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
