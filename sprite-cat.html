<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite cat</title>
<style>
  :root {
    --bg: #FFFFFF; --fg: #062E3E; --fg-dim: #3D5C48;
    --line: rgba(51, 48, 42, 0.22);
    --sans: ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --cycle: 0.9s;
    /* Sixteen drawings, so sixteen steps. At a 0.9s cycle that is 56ms a
       drawing -- animation on twos, which is what the sheet was drawn for. */
    --frames: 16;
    --cell: 254px;
    --stride: 132px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
         font-size: 15px; -webkit-font-smoothing: antialiased; padding: 28px; }

  /* One stage, one cat, one road. The three demos are not three panels any
     more -- they are the same pair of elements with their drivers swapped, so
     walking one demo off and the next one on is a single animal travelling
     rather than a hand-off between look-alikes. */
  .scene { position: relative; height: 320px; overflow: hidden; }

  /* The ground, drawn rather than paved: a pencil line with the hand's wobble
     in it, a little hatching along the surface, and some grit. No band and no
     kerb -- the page stays white, the way the sheet is.

     The tile is exactly one stride wide, which is not a design choice: the
     strip moves by one stride per cycle, so the pattern has to come back to
     itself over that distance or the loop seams. Everything wobbling inside it
     is built from sines with a whole number of cycles across it, so the two
     edges agree to the pixel.

     The edge line runs along the top of the tile with everything else below
     it, so there is one definite line for the cat to stand on rather than a
     haze of marks. Below it the marks thin and lighten with depth, the way a
     receding surface does. */
  .ground {
    position: absolute; top: 278px; left: 0;
    width: calc(100% + var(--stride)); height: 42px;
    background-image: url("images/road.png"); background-repeat: repeat-x;
    will-change: transform;
  }

  /* A window one cell wide onto a strip sixteen cells long. The strip moves
     with transform, not background-position: transform is the one the
     compositor will take, and stepping it keeps each drawing on screen for its
     whole 56ms instead of sliding between them.

     Every cell is aligned on where its cat meets the ground -- the bottom arc
     of the cast shadow -- and not on its lowest ink, which is a tail tip or a
     trailing paw in half of these drawings and sits up to 20px off. All
     sixteen put that contact on row 212, so the window only has to place row
     212 where the cat should stand: 30px past the road's edge line, on the
     road rather than along its front lip. */
  .window {
    position: absolute; left: 50%; top: 101px;
    width: var(--cell); height: 220px; margin-left: calc(var(--cell) / -2);
    overflow: hidden; will-change: transform;
  }
  .film {
    position: absolute; top: 0; left: 0; height: 220px;
    width: calc(var(--cell) * var(--frames));
    background-image: url("images/cat-frames.png"); background-size: 100% 100%;
    will-change: transform;
  }

  /* Which half of each pair the browser is running. Whatever does not carry
     .css is written from script, every frame, on this thread. */
  .film.css { animation: film var(--cycle) steps(var(--frames)) infinite; }
  .ground.css { animation: road var(--cycle) linear infinite; }
  /* The road holds still while a cat is walking on or off. The cat never
     pauses -- it is walking, that is the whole point of the entrance. */
  .ground.css.held { animation-play-state: paused; }

  @keyframes film { from { transform: translateX(0); }
                    to   { transform: translateX(calc(var(--cell) * var(--frames) * -1)); } }
  @keyframes road { from { transform: translateX(0); }
                    to   { transform: translateX(calc(0px - var(--stride))); } }

  .caption { margin: 0; padding: 14px 0 0; text-align: center; font-size: 12.5px;
    color: var(--fg-dim); border-top: 1px solid var(--line); }
  .caption b { display: block; color: var(--fg); font-weight: 500; }

  .bar { display: flex; align-items: center; justify-content: space-between;
    gap: 24px; margin-top: 26px; flex-wrap: wrap; }
  .pick { display: flex; gap: 8px; }
  button { font: inherit; font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--fg); background: transparent; border: 1px solid var(--line);
    padding: 9px 14px; cursor: pointer; white-space: nowrap;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease; }
  button:hover { border-color: var(--fg); }
  button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  :focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
</style>
</head>
<body>

<div class="scene">
  <span class="ground" id="road"></span>
  <div class="window" id="win"><div class="film" id="film"></div></div>
</div>
<p class="caption" id="caption"></p>

<div class="bar">
  <div class="pick" role="group" aria-label="Which half runs where">
    <button type="button" data-demo="0">JavaScript</button>
    <button type="button" data-demo="1">Half and half</button>
    <button type="button" data-demo="2">CSS</button>
  </div>
  <button type="button" id="block">Block 2000 ms</button>
</div>

<script>
(() => {
  'use strict';

  const scene = document.querySelector('.scene');
  const road = document.getElementById('road');
  const win = document.getElementById('win');
  const film = document.getElementById('film');
  const caption = document.getElementById('caption');
  const picks = [...document.querySelectorAll('[data-demo]')];

  const css = getComputedStyle(document.documentElement);
  const CYCLE_MS = parseFloat(css.getPropertyValue('--cycle')) * 1000;
  const FRAMES = parseInt(css.getPropertyValue('--frames'), 10);
  const CELL = parseFloat(css.getPropertyValue('--cell'));
  const STRIDE = parseFloat(css.getPropertyValue('--stride'));
  // The cat crosses the stage at exactly the speed the road runs under it. It
  // has to: its legs cover one stride per cycle, so any other speed and the
  // feet skate on the way in. It is also what makes walking on the spot and
  // walking across read as the same animal doing the same thing.
  const SPEED = STRIDE / CYCLE_MS;

  const DEMOS = [
    { cat: 'js',  road: 'js',  label: 'JavaScript',    note: 'cat and road both from script — main thread' },
    { cat: 'css', road: 'js',  label: 'Half and half', note: 'cat on the compositor, road from script' },
    { cat: 'css', road: 'css', label: 'CSS',           note: 'cat and road both stepped — compositor' },
  ];

  let current = 0, wanted = 0;
  let mode = 'enter';          // enter -> walk -> exit -> enter ...
  let catX = 0, roadDist = 0, cycleT = 0, last = null;

  // Far enough out that the cat is clear of the stage before it turns round.
  let offstage = 0;
  const measure = () => { offstage = scene.clientWidth / 2 + CELL / 2 + 8; };
  measure();
  addEventListener('resize', () => { const was = offstage; measure();
    if (mode === 'enter') catX += offstage - was; });
  catX = -offstage;

  // Where the road is showing right now, whoever is driving it.
  function roadNow() {
    const t = getComputedStyle(road).transform;
    if (t === 'none') return 0;
    const m = t.match(/matrix\(([^)]+)\)/);
    return m ? parseFloat(m[1].split(',')[4]) : 0;
  }

  function wear(i) {
    const d = DEMOS[i];
    // The cat is off stage when this runs, so its drawing can jump freely. The
    // road cannot: it is on screen the whole time, including through the
    // hand-over. So read off where it is and hand the new driver the same
    // position, or the pattern skips by however far the old one had got.
    const at = roadNow();

    film.classList.toggle('css', d.cat === 'css');
    road.classList.toggle('css', d.road === 'css');
    // Handing a property back to the stylesheet means letting go of it here.
    if (d.cat === 'css') film.style.transform = '';

    if (d.road === 'css') {
      road.style.transform = '';
      const anim = road.getAnimations()[0];
      // One cycle of the keyframes covers one stride, so position maps
      // straight onto time.
      if (anim) anim.currentTime = ((-at % STRIDE) / STRIDE) * CYCLE_MS;
    } else {
      roadDist = -at;
    }

    caption.innerHTML = '<b>' + d.label + '</b>' + d.note;
    picks.forEach((b, n) => b.setAttribute('aria-pressed', String(n === i)));
  }
  wear(current);

  function frame(now) {
    // Clamped, so that a blocked thread shows up as the animation losing that
    // time rather than teleporting to catch up when it comes back.
    const dt = last === null ? 0 : Math.min(now - last, 100);
    last = now;
    cycleT += dt;

    if (mode === 'enter') {
      catX = Math.min(0, catX + SPEED * dt);
      if (catX === 0) mode = 'walk';
    } else if (mode === 'walk') {
      roadDist += SPEED * dt;
      if (wanted !== current) mode = 'exit';
    } else {
      catX += SPEED * dt;
      if (catX >= offstage) { current = wanted; wear(current); catX = -offstage; mode = 'enter'; }
    }
    // The road only runs while the cat is standing still on it.
    road.classList.toggle('held', mode !== 'walk');

    win.style.transform = 'translateX(' + catX + 'px)';
    if (!film.classList.contains('css')) {
      const i = Math.floor((cycleT % CYCLE_MS) / CYCLE_MS * FRAMES);
      film.style.transform = 'translateX(' + (-i * CELL) + 'px)';
    }
    if (!road.classList.contains('css')) {
      road.style.transform = 'translateX(' + (-(roadDist % STRIDE)) + 'px)';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  picks.forEach((b, i) => b.addEventListener('click', () => { wanted = i; }));

  document.getElementById('block').addEventListener('click', () => {
    const end = performance.now() + 2000;
    let sink = 0;
    while (performance.now() < end) for (let i = 0; i < 3000; i++) sink += Math.sqrt(i * 1.0001);
    return sink;
  });
})();
</script>
</body>
</html>
