<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Three Ways</title>
<style>
  :root {
    --bg: #FFFFFF; --fg: #062E3E; --fg-dim: #3D5C48;
    --line: rgba(51, 48, 42, 0.22);
    --sans: ui-sans-serif, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --cycle: 0.9s;
    /* Sixteen drawings. At a 0.9s cycle that is 56ms a drawing -- animation on
       twos, which is what the sheet was drawn for. Read by the script, and
       written out a second time by hand in @keyframes film below: change one
       and the other has to change with it. */
    --frames: 16;
    --cell: 254px;
    --cell-h: 220px;
    /* The sheet is cut 4x4 and not 16x1, which is the obvious way to lay out a
       strip. WebKit hands any composited layer over 2048px on either side to a
       tile cache -- cMaxPixelDimension in GraphicsLayerCA.cpp -- and a tiled
       layer animating on the compositor flickers, because the tiles are
       rasterised behind the transform that is moving them. 16x1 is 4064px
       wide and tiles. 4x4 is 1016x880 and stays a single layer. */
    --cols: 4;
    --stride: 132px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans);
         font-size: 15px; -webkit-font-smoothing: antialiased; padding: 28px; }

  .scene { position: relative; height: 320px; overflow: hidden; }

  /* The road is three lanes, a third of the stage each, because each cat has
     to stand on the road belonging to its own demo. Every lane holds a
     full-width strip shifted back by the lane's own offset, so all three share
     one origin and read as a single unbroken road for as long as they agree.
     The moment one of them is driven by a thread that stalls, its third stops
     and the other two do not -- and the seam is the whole point. */
  .lane {
    position: absolute; top: 278px; height: 42px; overflow: hidden;
    left: calc(var(--n) * 100% / 3); width: calc(100% / 3);
  }
  .ground {
    position: absolute; top: 0; left: calc(var(--n) * -100%);
    width: calc(300% + var(--stride)); height: 42px;
    background-image: url("images/road.png"); background-repeat: repeat-x;
    will-change: transform;
  }

  /* A window one cell wide onto a strip sixteen cells long. The strip moves
     with transform, not background-position: transform is the one the
     compositor will take, and stepping it keeps each drawing on screen for its
     whole 56ms instead of sliding between them.

     Every cell is aligned on where its cat meets the ground -- the bottom arc
     of the cast shadow -- and not on its lowest ink, which is a tail tip or a
     trailing paw in half of these drawings and sits up to 20px off. All
     sixteen put that contact on row 212, so the window only has to place row
     212 where the cat should stand: 30px past the road's edge line. */
  .window {
    position: absolute; left: 0; top: 101px;
    width: var(--cell); height: var(--cell-h); margin-left: calc(var(--cell) / -2);
    overflow: hidden; will-change: transform;
  }
  .film {
    position: absolute; top: 0; left: 0;
    width: calc(var(--cell) * var(--cols));
    height: calc(var(--cell-h) * var(--frames) / var(--cols));
    background-image: url("images/cat-frames-grid.png"); background-size: 100% 100%;
    will-change: transform;
  }

  /* Whatever does not carry .css is written from script, every frame, on this
     thread. */
  .film.css { animation: film var(--cycle) linear infinite; }
  .ground.css { animation: road var(--cycle) linear infinite; }
  /* Only ever true before the first cat has finished walking on. */
  .ground.held { animation-play-state: paused; }

  /* Sixteen holds, and not steps(16), which is what this obviously wants to be.
     WebKit will not give an animation carrying a steps() timing function to
     Core Animation -- animationCanBeAccelerated() in GraphicsLayerCA.cpp sees
     the steps and returns false -- so in Safari the walk cycle would run on
     this thread and stop dead the moment anything blocked it. Which is the one
     thing this page exists to disprove. Chrome's compositor implements step
     timing functions, so it never showed.

     So each drawing is held flat across its whole slot and jumps in the last
     0.01% of it. What Core Animation interpolates is 0.09ms wide. Nobody sees
     it, and the animation is on the compositor where it belongs. */
  @keyframes film {
    0%,      6.24% { transform: translate(calc(var(--cell) *  0), calc(var(--cell-h) *  0)); }
    6.25%,  12.49% { transform: translate(calc(var(--cell) * -1), calc(var(--cell-h) *  0)); }
    12.5%,  18.74% { transform: translate(calc(var(--cell) * -2), calc(var(--cell-h) *  0)); }
    18.75%, 24.99% { transform: translate(calc(var(--cell) * -3), calc(var(--cell-h) *  0)); }
    25%,    31.24% { transform: translate(calc(var(--cell) *  0), calc(var(--cell-h) * -1)); }
    31.25%, 37.49% { transform: translate(calc(var(--cell) * -1), calc(var(--cell-h) * -1)); }
    37.5%,  43.74% { transform: translate(calc(var(--cell) * -2), calc(var(--cell-h) * -1)); }
    43.75%, 49.99% { transform: translate(calc(var(--cell) * -3), calc(var(--cell-h) * -1)); }
    50%,    56.24% { transform: translate(calc(var(--cell) *  0), calc(var(--cell-h) * -2)); }
    56.25%, 62.49% { transform: translate(calc(var(--cell) * -1), calc(var(--cell-h) * -2)); }
    62.5%,  68.74% { transform: translate(calc(var(--cell) * -2), calc(var(--cell-h) * -2)); }
    68.75%, 74.99% { transform: translate(calc(var(--cell) * -3), calc(var(--cell-h) * -2)); }
    75%,    81.24% { transform: translate(calc(var(--cell) *  0), calc(var(--cell-h) * -3)); }
    81.25%, 87.49% { transform: translate(calc(var(--cell) * -1), calc(var(--cell-h) * -3)); }
    87.5%,  93.74% { transform: translate(calc(var(--cell) * -2), calc(var(--cell-h) * -3)); }
    93.75%, 100%   { transform: translate(calc(var(--cell) * -3), calc(var(--cell-h) * -3)); }
  }
  @keyframes road { from { transform: translateX(0); }
                    to   { transform: translateX(calc(0px - var(--stride))); } }

  .top { display: flex; justify-content: center; margin-bottom: 24px; }
  .bar { display: flex; justify-content: center; margin-top: 48px; }

  /* The scene switcher stays out of the way: no box, no fill, just three
     numerals that lift when they are the live one. */
  .pick { display: flex; gap: 18px; }
  .pick button { border: 0; background: transparent; padding: 6px 12px;
    min-width: 34px; text-align: center; font-size: 13px; letter-spacing: 0.08em;
    color: var(--fg-dim); opacity: 0.38; transition: opacity 160ms ease, color 160ms ease; }
  .pick button:hover { opacity: 0.75; border-color: transparent; }
  .pick button[aria-pressed="true"] { opacity: 1; background: transparent; color: var(--fg); }
  button { font: inherit; font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--fg); background: transparent; border: 1px solid var(--line);
    padding: 9px 14px; cursor: pointer; white-space: nowrap;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease; }
  #block { font-size: 12px; padding: 15px 30px; letter-spacing: 0.2em; }
  button:hover { border-color: var(--fg); }
  button[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  :focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }

  /* Page switcher: one narrow strip across the top of both demos. */
  .pages { display: flex; align-items: center; gap: 22px; height: 32px;
           padding: 0 28px; border-bottom: 1px solid var(--line);
           font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
  .pages a { color: var(--fg-dim); text-decoration: none; padding: 4px 0; }
  .pages a:hover { color: var(--fg); }
  .pages a[aria-current="page"] { color: var(--fg); box-shadow: inset 0 -1px currentColor; }
  .pages { margin: -28px -28px 28px; }
</style>
</head>
<body>

<nav class="pages" aria-label="Demos">
  <a href="index.html">Timeline</a>
  <a href="three-cats.html" aria-current="page">Three Ways</a>
</nav>

<div class="top">
  <button type="button" id="block">Block the Main Thread</button>
</div>

<div class="scene" id="scene">
  <div class="lane" style="--n: 0"><span class="ground" data-lane="0"></span></div>
  <div class="lane" style="--n: 1"><span class="ground" data-lane="1"></span></div>
  <div class="lane" style="--n: 2"><span class="ground" data-lane="2"></span></div>

  <div class="window" data-cat="0"><div class="film"></div></div>
  <div class="window" data-cat="1"><div class="film css"></div></div>
  <div class="window" data-cat="2"><div class="film css"></div></div>
</div>

<div class="bar">
  <div class="pick" role="group" aria-label="How many cats are on stage">
    <button type="button" data-stage="1" aria-label="One cat">1</button>
    <button type="button" data-stage="2" aria-label="Two cats">2</button>
    <button type="button" data-stage="3" aria-label="Three cats">3</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const scene = document.getElementById('scene');
  const grounds = [...document.querySelectorAll('.ground')];
  const wins = [...document.querySelectorAll('.window')];
  const picks = [...document.querySelectorAll('[data-stage]')];

  const css = getComputedStyle(document.documentElement);
  const CYCLE_MS = parseFloat(css.getPropertyValue('--cycle')) * 1000;
  const FRAMES = parseInt(css.getPropertyValue('--frames'), 10);
  const CELL = parseFloat(css.getPropertyValue('--cell'));
  const CELL_H = parseFloat(css.getPropertyValue('--cell-h'));
  const COLS = parseInt(css.getPropertyValue('--cols'), 10);
  const STRIDE = parseFloat(css.getPropertyValue('--stride'));
  // A cat crosses the stage at exactly the speed the road runs under it. It
  // has to: its legs cover one stride per cycle, so at any other speed the feet
  // skate on the way in.
  const SPEED = STRIDE / CYCLE_MS;

  // Which lane each demo ends up standing over, and how each is driven.
  // Demo 0 finishes on the right, so the running order left to right is the
  // reverse of the order they arrive in.
  const DEMOS = [
    { lane: 2, film: 'js',  road: 'js'  },
    { lane: 1, film: 'css', road: 'js'  },
    { lane: 0, film: 'css', road: 'css' },
  ];
  // Where each cat stands, as a fraction across the stage, per stage count.
  const HOMES = [[1 / 2], [5 / 6, 1 / 2], [5 / 6, 1 / 2, 1 / 6]];

  let W = 0, offL = 0, offR = 0;
  const measure = () => { W = scene.clientWidth; offL = -(CELL / 2 + 8); offR = W + CELL / 2 + 8; };
  measure();

  const cats = wins.map((el, i) => ({
    el, film: el.querySelector('.film'),
    x: offL, home: null, on: i === 0, parked: i !== 0,
  }));

  let stage = 1, roadStart = null, last = null;

  // Every walk cycle on this page runs off one clock: the document timeline
  // the stylesheet's animations are already on. Read the origin off one of
  // them and the script-driven cat is on the same beat as the compositor-
  // driven ones by construction.
  //
  // It also means a blocked thread costs the script cat its frames without
  // costing it its place. It cannot paint while the thread is busy, so it
  // stops; when the thread comes back it picks up where the clock has got to,
  // not where it left off, and falls straight back into step. An accumulator
  // would have it limping a little further behind after every block.
  let origin = null, tries = 0;
  function phaseOrigin() {
    if (origin !== null) return origin;
    const ref = cats[1].film;
    if (!ref.getAnimations || ++tries > 240) return (origin = 0);
    const a = ref.getAnimations()[0], st = a && a.startTime;
    const v = typeof st === 'number' ? st : (st && st.value);
    if (typeof v === 'number' && isFinite(v)) origin = v;
    return origin === null ? 0 : origin;
  }

  function homes() {
    const h = HOMES[stage - 1];
    cats.forEach((c, i) => {
      const was = c.on;
      c.on = i < stage;
      if (!c.on) { c.home = null; return; }
      c.home = h[i] * W;
      if (!was) c.parked = false;
    });
    picks.forEach((b, i) => b.setAttribute('aria-pressed', String(i < stage)));
  }

  // Where a lane's road is showing, whoever is driving it.
  function laneAt(g) {
    const t = getComputedStyle(g).transform;
    if (t === 'none') return 0;
    const m = t.match(/matrix\(([^)]+)\)/);
    return m ? parseFloat(m[1].split(',')[4]) : 0;
  }
  // A lane only takes on its demo's driver once that cat has actually arrived,
  // so the road never changes hands under a moving animal.
  function drive(lane, wantCss) {
    const g = grounds[lane];
    if (g.classList.contains('css') === wantCss) return;
    const at = laneAt(g);               // the road is on screen throughout, so
    g.classList.toggle('css', wantCss); // hand the new driver the same position
    if (wantCss) {                      // or the pattern skips
      g.style.transform = '';
      const anim = g.getAnimations()[0];
      if (anim) anim.currentTime = ((-at % STRIDE) / STRIDE) * CYCLE_MS;
    } else {
      g.style.transform = 'translateX(' + at + 'px)';
    }
  }

  function frame(now) {
    // Clamped, so a blocked thread reads as the animation losing that time
    // rather than teleporting to catch up when it comes back.
    const dt = last === null ? 0 : Math.min(now - last, 100);
    last = now;

    // One phase, shared by every cat.
    let p = (now - phaseOrigin()) % CYCLE_MS;
    if (p < 0) p += CYCLE_MS;
    // Same cell the stylesheet's keyframes are on at this moment, read off the
    // same grid: across for the column, down for the row.
    const f = Math.floor(p / CYCLE_MS * FRAMES);
    const shot = 'translate(' + (-(f % COLS) * CELL) + 'px, '
               + (-Math.floor(f / COLS) * CELL_H) + 'px)';

    cats.forEach((c) => {
      if (!c.on) {
        if (!c.parked) {                      // walk off the way it was going
          c.x += SPEED * dt;
          if (c.x >= offR) { c.x = offL; c.parked = true; }
        }
      } else if (c.x > c.home + 0.5) {
        // Being asked to move left. Cats do not walk backwards, so it carries
        // on off the right and comes round again.
        c.x += SPEED * dt;
        if (c.x >= offR) c.x = offL;
      } else if (c.x < c.home - 0.5) {
        c.x = Math.min(c.home, c.x + SPEED * dt);
      } else {
        c.x = c.home;
      }
      c.el.style.transform = 'translateX(' + c.x + 'px)';
      if (!c.film.classList.contains('css')) c.film.style.transform = shot;
    });

    // The road is still only until the first cat has finished walking on.
    // After that it runs whatever else is crossing the stage. Off the clock
    // rather than off a running total, for the same reason as the cats: a
    // blocked thread should cost the script-driven lanes their frames, not
    // their place, so they come back level with the compositor-driven one
    // instead of trailing it a little further after every block.
    if (roadStart === null && cats[0].on && cats[0].x === cats[0].home) roadStart = now;
    const roadDist = roadStart === null ? 0 : (now - roadStart) * SPEED;

    // Each lane takes its demo's driver once that cat is home; until then it
    // follows the first demo, so the road looks like one road.
    for (let lane = 0; lane < 3; lane++) {
      const d = DEMOS.findIndex((x) => x.lane === lane);
      const c = cats[d];
      const settled = c && c.on && c.x === c.home;
      drive(lane, settled ? DEMOS[d].road === 'css' : false);
    }
    grounds.forEach((g) => {
      g.classList.toggle('held', roadStart === null);
      if (!g.classList.contains('css')) g.style.transform = 'translateX(' + (-(roadDist % STRIDE)) + 'px)';
    });

    requestAnimationFrame(frame);
  }

  addEventListener('resize', () => {
    const old = W; measure();
    cats.forEach((c) => { if (c.on && old) c.x *= W / old; });
    homes();
  });
  homes();
  requestAnimationFrame(frame);

  picks.forEach((b, i) => b.addEventListener('click', () => { stage = i + 1; homes(); }));

  document.getElementById('block').addEventListener('click', () => {
    const end = performance.now() + 2000;
    let sink = 0;
    while (performance.now() < end) for (let i = 0; i < 3000; i++) sink += Math.sqrt(i * 1.0001);
    return sink;
  });
})();
</script>
</body>
</html>
